[workspace]
resolver = "2"
members = ["conserved"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94.0"

# Dependency convention (mitosys's, per AGENTS.md §divergences): every
# external dependency is pinned once here and inherited by members.
# Empty at p0; blake3 entered in p2, behind ContentId.
[workspace.dependencies]
# The one dependency. `"1"` is the same version string `../model/Cargo.toml:19`
# already declares, with blake3's default features, so no build behaviour new
# to that tree enters with the crate.
blake3 = "1"

# Dev-only. `proptest` is the family's property-test crate —
# `../model/Cargo.toml:80` already declares "1.11" — so this introduces no
# second generator into the family. Dev-dependencies do not appear in
# `cargo tree --edges normal`, so the crate's one-dependency contract is
# untouched.
proptest = "1.11"
